<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HWBT Research Box</title>
<meta name="description" content="Car parts and their cheaper alternatives, for any car. Search by car, by category or by part number.">
<link rel="icon" href="../assets/brand/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Poppins:ital,wght@0,400;0,600;1,800&display=swap" rel="stylesheet">
<script>/* theme before first paint: light by default, dark when chosen */
(function () { var t = 'light'; try { t = localStorage.getItem('hwbt2-theme') === 'dark' ? 'dark' : 'light'; } catch (e) {} document.documentElement.dataset.theme = t; })();
/* demo only: accent strength (quiet, balanced, full), full by default */
(function () { document.documentElement.dataset.accent = 'full'; })();</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="demo-strip"><span class="ds-t">Demo by Off-Plate. A website concept, far from a finished site. It shows what is possible today.</span></div>

<header class="hdr" id="hdr">
  <div class="wrap hdr-in">
    <a class="brand" href="#/" aria-label="HWBT Research Box home"><img src="../assets/brand/logo.svg" alt="HWBT" width="86" height="22"><span>RESEARCH<b>.BOX</b></span></a>
    <button class="hsearch" type="button" data-open-search aria-label="Search parts, part numbers and cars">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span>Part name, part number or car</span><kbd>/</kbd>
    </button>
    <nav class="nav" aria-label="Main">
      <button type="button" class="nav-cats" aria-expanded="false" aria-controls="mega">Categories
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 9l6 6 6-6"/></svg></button>
      <a href="#/makes" data-nav="makes">Makes</a>
      <a href="#/submit" data-nav="submit">Submit a find</a>
    </nav>
    <div class="hicons">
      <button class="ibtn msearch" type="button" data-open-search aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
      <button class="ibtn hcar" id="hcar" type="button" data-garage aria-haspopup="dialog" aria-expanded="false" aria-label="Pick your car"></button>
      <a class="ibtn" href="#/box" aria-label="Saved parts" data-nav="box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4.5L6 21z" stroke-linejoin="round"/></svg>
        <span class="boxcount" data-n="0">0</span>
      </a>
      <button class="ibtn acct" type="button" data-account aria-haspopup="dialog" aria-label="Sign in">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4 4.3-6 8-6s6.8 2 8 6" stroke-linecap="round"/></svg><span class="acct-l">Sign in</span>
      </button>
      <button class="ibtn tgl" type="button" data-theme-toggle aria-label="Switch to dark mode" aria-pressed="false"></button>
      <button class="ibtn menu-btn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="mnav">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
  <div class="mega" id="mega" hidden></div>
</header>

<nav class="mnav" id="mnav" aria-label="Mobile" hidden></nav>

<main id="app" tabindex="-1"></main>

<footer class="foot" id="foot"></footer>

<div class="so" id="so" role="dialog" aria-modal="true" aria-label="Search" hidden>
  <div class="so-panel">
    <div class="so-bar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="so-input" type="search" placeholder="Part name, part number or car" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="so-list" aria-autocomplete="list">
      <button class="so-close" type="button" id="so-close">Esc</button>
    </div>
    <div class="so-scope" id="so-scope"></div>
    <div class="so-list" id="so-list" role="listbox" aria-label="Search results"></div>
    <div class="so-foot"><span>Up and down to move</span><span>Enter to open</span><span>Esc to close</span></div>
  </div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-panel">
    <div class="sheet-head"><h2 id="sheet-title"></h2><button type="button" class="ibtn" data-close-sheet aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>
<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data/taxonomy.js" defer></script>
<script src="data/vehicles.js" defer></script>
<script src="data/parts.js" defer></script>
<script src="data/core.js" defer></script>
<script src="data/anchors.js" defer></script>
<script src="data/viewer.js" defer></script>
<script src="shop.js" defer></script>
<script src="ui.js" defer></script>
<script src="listing.js" defer></script>
<script src="views.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
